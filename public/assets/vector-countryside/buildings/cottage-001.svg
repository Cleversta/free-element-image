<linearGradient id="v4g0" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#fff9cc"/><stop offset=".48" stop-color="#ead7b0"/><stop offset="1" stop-color="#a89b7f"/></linearGradient>
