<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300"><defs>
<linearGradient id="v4g0" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#c48b5d"/><stop offset=".48" stop-color="#a97850"/><stop offset="1" stop-color="#7a563a"/></linearGradient>
