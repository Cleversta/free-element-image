<linearGradient id="v4g3" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#e6ba83"/><stop offset=".48" stop-color="#c6a071"/><stop offset="1" stop-color="#8f7351"/></linearGradient>
