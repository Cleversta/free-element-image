<linearGradient id="v4g0" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#fffff0"/><stop offset=".48" stop-color="#f0e5cf"/><stop offset="1" stop-color="#ada595"/></linearGradient>
