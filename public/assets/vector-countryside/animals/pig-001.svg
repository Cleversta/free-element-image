<linearGradient id="v4g0" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#ffbeb7"/><stop offset=".48" stop-color="#e5a49e"/><stop offset="1" stop-color="#a57672"/></linearGradient>
<linearGradient id="v4g1" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#f09691"/><stop offset=".48" stop-color="#cf817d"/><stop offset="1" stop-color="#955d5a"/></linearGradient>
