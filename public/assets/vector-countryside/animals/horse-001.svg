<linearGradient id="v4g3" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#a06e51"/><stop offset=".48" stop-color="#8a5f46"/><stop offset="1" stop-color="#634432"/></linearGradient>
