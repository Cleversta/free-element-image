<linearGradient id="v4g0" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#c3885d"/><stop offset=".48" stop-color="#a87550"/><stop offset="1" stop-color="#79543a"/></linearGradient>
