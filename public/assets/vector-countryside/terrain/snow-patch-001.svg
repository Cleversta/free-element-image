<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 300"><defs>
<linearGradient id="v4g0" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#edf1ec"/><stop offset="1" stop-color="#abaeaa"/></linearGradient>
<filter id="v5Material" x="-22%" y="-22%" width="144%" height="150%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency=".012 .030" numOctaves="4" seed="37" result="micro"/>
